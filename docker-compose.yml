services:
  postgres:
    image: postgres:17-alpine
    container_name: neagold-postgres
    environment:
      POSTGRES_USER: neagold
      POSTGRES_PASSWORD: neagold_dev_password
      POSTGRES_DB: neagold
    ports:
      - "5432:5432"
    volumes:
      - neagold_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neagold -d neagold"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  neagold_pgdata: